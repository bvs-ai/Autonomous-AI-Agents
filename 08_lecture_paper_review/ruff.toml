# Набір правил для демо лекції 08. Свідомо вужчий за дефолт редактора:
# код у демо повторює приклади з офіційної документації MCP SDK, і стилістичні
# зауваження до нього (як-от SIM117 на вкладені `async with`) тут зайві —
# вкладеність показує два різні часи життя: транспорт і сесію.
target-version = "py312"
line-length = 100

[lint]
# E4/E7/E9 + F — дефолт ruff (імпорти, синтаксис, невикористані імена).
# ASYNC — ловить справжні баги: блокуючі виклики всередині event loop (ASYNC220).
select = ["E4", "E7", "E9", "F", "ASYNC"]
